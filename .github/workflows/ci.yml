name: APEX CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run test suite
        run: python -m pytest -q
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate production API security configuration
        run: python -c "from apex.security import security_settings; import os; os.environ['APEX_ENV']='production'; os.environ['APEX_API_KEY']='ci-only-strong-key-0123456789-abcdef'; assert security_settings()[0] == 'production'"
      - name: Build inference container
        run: docker build -t apex-mlops:ci .
